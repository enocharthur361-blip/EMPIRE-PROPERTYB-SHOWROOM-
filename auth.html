<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - EMPIRE PROPERTY SHOWROOM</title>
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🏢 EMPIRE PROPERTY</h1>
                <p>Real Estate Management Platform</p>
            </div>

            <!-- Login Tab -->
            <div id="loginTab" class="auth-tab active">
                <h2>Login</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-auth">Login</button>
                </form>
                <p class="auth-toggle">Don't have an account? <a href="#" onclick="switchTab('register')">Register Here</a></p>
            </div>

            <!-- Register Tab -->
            <div id="registerTab" class="auth-tab">
                <h2>Create Account</h2>
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="registerPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Account Type</label>
                        <select id="registerRole" required>
                            <option value="">Select Account Type</option>
                            <option value="owner">Property Owner</option>
                            <option value="agent">Real Estate Agent</option>
                            <option value="broker">Broker/Agency</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn-auth">Create Account</button>
                </form>
                <p class="auth-toggle">Already have an account? <a href="#" onclick="switchTab('login')">Login Here</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
